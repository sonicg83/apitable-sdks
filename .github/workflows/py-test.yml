name: Python Compatibility Offline Tests

on:
  push:
    branches: ["compat/apitable-cli-v0.1"]
    paths:
      - "apitable.py/**"
      - ".github/workflows/py-test.yml"
  pull_request:
    paths:
      - "apitable.py/**"
      - ".github/workflows/py-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build and install wheel
        shell: pwsh
        run: |
          python -m pip wheel --no-deps ./apitable.py --wheel-dir ./dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdkWheel = (Get-ChildItem ./dist/apitable-*.whl).FullName
          python -m pip install $sdkWheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installed SDK outside checkout
        shell: pwsh
        run: |
          $sdkTests = Join-Path $env:GITHUB_WORKSPACE 'apitable.py/tests_cli_compat'
          Set-Location $env:RUNNER_TEMP
          python -c "import apitable,pathlib,sys; assert pathlib.Path(apitable.__file__).is_relative_to(pathlib.Path(sys.prefix)/'Lib/site-packages')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s $sdkTests -v
