[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "apitable"
dynamic = ["version"]
description = "APITable OpenAPI Python SDK (repository baseline)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["requests>=2.32,<3", "pydantic>=2.10,<3"]

[tool.setuptools.dynamic]
version = { file = ".version" }

[tool.setuptools.packages.find]
include = ["apitable", "apitable.*"]
